  medical:
    text: 先把血糖控制好有助于伤口愈合与骨结合。
    topic: 糖尿病与种植牙
    href: ''
    published: false
  complex:
    text: 由于存在需注意的药物/状况，建议由专科牙医进行个别评估。
    topic: 专科咨询
    href: ''
    published: false
  bruxism:
    text: 若有磨牙，可能需要佩戴咬合垫以保护种植体免受过大咬合力。
    topic: 磨牙与种植牙
    href: ''
    published: false
  allarch:
    text: 缺失较多时，All-on-X（即刻负重）可能适合您 —— 4–6 颗种植体支撑整个牙弓。
    topic: All-on-X 全口种植
    href: ''
    published: false
