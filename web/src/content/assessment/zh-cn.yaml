  body: 填写信息即可在页面查看报告并获取邮件副本。仅在您需要时我们才会联系您。
  nameLabel: 姓名
  phoneLabel: 电话号码
  emailLabel: 邮箱
  sexLabel: 性别（选填）
  sexOptions: [男, 女, 不愿透露]
  pdpa: 我同意接受联系并依据 PDPA 政策处理我的资料。
  submitLabel: 查看完整报告
  sending: 处理中…
  success: 完成 ✓ 副本已发送到您的邮箱
