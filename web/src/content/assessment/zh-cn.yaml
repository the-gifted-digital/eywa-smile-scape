faq:
  - q: 这个自测能代替牙科检查吗？
    a: 不能 —— 这是科普式的初步自测。真实结果需要牙医的检查与 X 光片。
  - q: 我的信息安全吗？
    a: 我们依据 PDPA 政策存储数据，仅在您同意的范围内用于发送结果/回访。
  - q: 需要多长时间？
    a: 约 1 分钟，共 10 道简短问题。
